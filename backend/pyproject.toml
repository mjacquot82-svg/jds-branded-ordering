[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guesthouse-backend"
version = "0.1.0"
description = "Backend API for The Guest House Café & Pantry preorder application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<1.19",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "py-vapid>=1.9.4,<2",
  "pywebpush>=2.3.0,<3",
  "qrcode>=8,<9",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "postgresql: requires a PostgreSQL test database",
]

[tool.setuptools.packages.find]
include = ["app*"]

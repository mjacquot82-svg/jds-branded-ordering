# Controlled DEMO PILOT blueprint (M2.5). Manual create only. autoDeploy false.
# Do NOT point at Guest House / Ladel's / production databases or disks.
services:
  - type: web
    name: jds-branded-ordering-demo-pilot-api
    runtime: python
    branch: m2.5/controlled-demo-launch
    plan: 0.5c-512mb
    region: ohio
    rootDir: backend
    buildCommand: pip install .
    preDeployCommand: python -m app.db.migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    disk:
      name: jds-demo-pilot-media
      mountPath: /var/data/jds-demo-pilot-media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jds-branded-ordering-demo-pilot-db
          property: connectionString
      - key: JDS_LOCAL_MEDIA_ROOT
        value: /var/data/jds-demo-pilot-media

databases:
  - name: jds-branded-ordering-demo-pilot-db
    databaseName: jds_branded_ordering_demo_pilot
    user: jds_demo_pilot
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: ohio
    postgresMajorVersion: "17"
